# ---------------------------------------------------------------------------
# TOP-LEVEL STRATEGIC FRAMEWORKS
# ---------------------------------------------------------------------------
frameworks:
  - id: shaping-europes-digital-future
    name: "Shaping Europe's Digital Future"
    short: "Shaping Europe's Digital Future"
    type: Communication
    published: 2020-02
    description: >
      Founding communication of February 2020. Sets a comprehensive five-year
      strategy centred on data as an asset, sustainable technologies,
      cybersecurity, and digital sovereignty, on three pillars: digital
      technologies benefit people, a fair and competitive market for EU
      organizations, and an open, democratic society respectful of European
      fundamental rights. Main reference for the period 2019-2024.

  - id: digital-compass
    name: "2030 Digital Compass: the European way for the Digital Decade"
    short: "Digital Compass"
    type: Communication
    published: 2021-03
    description: >
      More operative communication (March 2021) translating the high-level
      vision of "Shaping Europe's Digital Future" into measurable 2030 targets
      in four areas (connectivity, digital skills, digital business, digital
      public services), adding the annual "State of the Digital Decade"
      monitoring mechanism.

  - id: digital-decade-policy-programme
    name: "Digital Decade Policy Programme 2030"
    short: "Digital Decade"
    type: Decision
    published: 2022
    description: >
      Binding instrument (2022) implementing the Digital Compass, referring to
      the decade 2020-2030. Includes the Digital Decade Policy Programme (DDPP)
      with measurable targets and the annual monitoring mechanism, the
      multi-country projects, and the Declaration on Digital Rights and
      Principles.

  - id: declaration-digital-rights-principles
    name: "Declaration on Digital Rights and Principles"
    short: "Digital Rights and Principles"
    type: Communication
    published: 2022
    description: >
      Component of the Digital Decade. Guides the digital transition to be
      people-centric: respectful of human rights, supportive of solidarity and
      inclusion, fostering participation and the sustainability of the digital
      future.

  - id: competitiveness-compass
    name: "Competitiveness Compass"
    short: "Competitiveness Compass"
    type: Communication
    published: 2025-01
    description: >
      Communication of January 2025, current reference for the period
      2024-2029. Builds directly on the Draghi report; sets a vision to close
      the innovation gap, reduce dependencies on foreign countries, and promote
      European preference in public procurement.

  - id: european-technological-sovereignty-package
    name: "European Technological Sovereignty Package"
    short: "European Technological Sovereignty Package"
    type: Bundles
    published: 2026-06
    description: >
      Framework launched by the EC in June 2026 building on the Competitiveness
      Compass. Bundles initiatives such as the Chips Act 2.0, the Cloud and AI
      Development Act (CADA), and the Open Source Strategy.

