    domain: cybersecurity-identity
    framework: []
    dates:
      proposed: 2020-12
    description: >
      Aims to certify cloud services. First drafted by ENISA in December 2020,
      not yet formalized. Discussion still in progress, especially on digital
      data sovereignty conditions, which appear to have been delegated to the
      CADA (complementing the revised CSA).
    builds_on: [eccf]
    relates_to: [revised-cybersecurity-act, cada]
    organizations: [enisa]
    references: ["[109]", "[110]"]

  - id: eucc
    name: "European Common Criteria-based cybersecurity certification scheme"
    acronym: "EUCC"
    type: Regulation
    status: adopted
    domain: cybersecurity-identity
    framework: []
    dates:
      published: 2024-01
    description: >
      Formally established January 2024. Allows ICT suppliers to certify the
      cybersecurity of digital products (smartcards, routers, cryptography
      modules, software) through a common assessment process based on the Common
      Criteria/SOG-IS evaluation methodology. Offers two assurance levels
      (substantial and high). Can help demonstrate compliance with the CRA and
      NIS2.
    builds_on: [eccf]
    relates_to: [cyber-resilience-act, nis2, revised-cybersecurity-act]
    organizations: [enisa]
    references: ["[111]"]

