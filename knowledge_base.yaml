initiatives:
  # ---------------------------- DATA ----------------------------
  - id: european-strategy-for-data
    name: "European Strategy for Data"
    acronym: "ESD"
    type: Communication
    status: adopted
    domain: data
    framework: [shaping-europes-digital-future]
    dates:
      published: 2020-02
    description: >
      A key action of "Shaping Europe's Digital Future" (published the same
      day). Aims to create the single European market for data by facilitating
      data access, sharing, and usage across sectors and promoting data-driven
      innovation. Comprises the Open Data Directive, the Data Governance Act,
      and the Data Act.
    builds_on: []
    relates_to: [open-data-directive, data-governance-act, data-act, data-union-strategy]
    organizations: []
    references: ["[6]"]

  - id: open-data-directive
    name: "Open Data Directive"
    acronym: "ODD"
    type: Directive
    status: adopted
    domain: data
    framework: [shaping-europes-digital-future]
    dates:
      published: 2019-06
      entered_into_force: 2019-07
      entered_into_application: 2021-07
    description: >
      Common legal framework promoting the reuse of non-sensitive public-sector
      data (geospatial, mobility, statistics, environment). Replaces the 2003
      Public Sector Information (PSI) directive; defines high-value datasets.
      Included retroactively in the European Strategy for Data.
    builds_on: []
    relates_to: [european-strategy-for-data]
    organizations: []
    references: ["[16]"]

  - id: data-governance-act
    name: "Data Governance Act"
    acronym: "DGA"
    type: Regulation
    status: adopted
    domain: data
    framework: [shaping-europes-digital-future]
    dates:
      published: 2022-06
      entered_into_force: 2022-06
      entered_into_application: 2023-09
    description: >
      Enhances trust in data intermediaries to increase voluntary sharing of
      personal and non-personal data (GDPR applies where personal data is
      concerned) and data availability/reuse, especially for public-sector data
      that cannot be open data. Supports Common European Data Spaces in
      sectors such as healthcare, environment, energy, agriculture, mobility,
      and finance.
    builds_on: [european-strategy-for-data]
    relates_to: [data-act]
    organizations: []
    references: ["[17]", "[18]", "[19]"]

  - id: data-act
    name: "Data Act"
    acronym: "Data Act"
    type: Regulation
    status: adopted
    domain: data
    framework: [shaping-europes-digital-future]
    dates:
      published: 2023-12
      entered_into_force: 2024-01
      entered_into_application: 2025-09
    description: >
      Building on the DGA, ensures fairness in the allocation of value produced
      by data amongst participants in the data economy, especially data sourced
      from the Internet of Things. Grants users more control over data generated
      by connected devices and requires transferability and switching between
      cloud providers.
    builds_on: [data-governance-act]
    relates_to: [ipcei-cis]
    organizations: []
    references: ["[20]", "[21]", "[22]"]

  - id: data-union-strategy
    name: "Data Union Strategy"
    acronym: "Data Union Strategy"
    type: Communication
    status: adopted
    domain: data
    framework: [competitiveness-compass]
    dates:
      published: 2025-11
    description: >
      Following the realization that AI needs vastly more data than anticipated
      by the European Strategy for Data, further increases data availability for
      AI development — simplifying data-access rules (Open Data Directive, DGA,
      Data Act), creating data labs within AI Factories and Gigafactories, and
      connecting Common European Data Spaces and AI ecosystems — while
      safeguarding EU data sovereignty in international data flows. Partially
      operationalized via the Digital Omnibus.
    builds_on: [european-strategy-for-data, digital-omnibus]
    relates_to: [ai-factories, ai-gigafactories]
    organizations: []
    references: ["[23]", "[24]"]

  # ---------------------------- ONLINE PLATFORMS ----------------------------
  - id: digital-services-act
