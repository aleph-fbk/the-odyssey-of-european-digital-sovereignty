    description: >
      Legislative proposal (November 2025) contained in the Digital Package,
      building on the EUDI Regulation. Adds functionalities specific for
      businesses, e.g., digital management of representation rights and mandates,
      and a secure channel for exchanging official documents with public
      authorities.
    builds_on: [eudi-regulation]
    relates_to: []
    organizations: []
    references: ["[110]"]

