# ---------------------------------------------------------------------------
# NOTEWORTHY ORGANIZATIONS
# ---------------------------------------------------------------------------
orgs:
  - id: gaia-x
    name: "Gaia-X"
    kind: association
    description: >
      Privately funded non-for-profit association (announced 2019, operative
      since 2021) launched by France and Germany to build a federated,
      secure, and interoperable cloud infrastructure for Europe. Sets
      specifications, rules, policies and a verification framework rather than
      providing cloud services itself. Criticized on execution.
    initiatives: [ipcei-cis, cloud-sovereignty-framework, open-source-strategy]

  - id: european-alliance-industrial-data-edge-cloud
    name: "European Alliance for Industrial Data, Edge and Cloud"
    kind: alliance
    description: >
      Alliance launched in 2021 to foster development and deployment of cloud
      and edge services. Technically active but increasingly sidelined by
      faster-moving initiatives such as IPCEI-CIS.
    initiatives: [ipcei-cis]

  - id: alliance-on-processors-semiconductor-technologies
    name: "Alliance on Processors and Semiconductor Technologies"
    kind: industry-alliance
    description: >
      Bottom-up industrial collaboration grouping key actors in chip design
      and production to identify production and technological gaps.
    initiatives: [chips-act, chips-act-2]

  - id: semicon-coalition-europe
    name: "Semiconductor Coalition Europe (Semicon Coalition)"
    kind: industry-alliance
    description: >
      Coalition of all 27 member states reinforcing cooperation for research,
      production capacity, and skills supporting European digital sovereignty
      in the semiconductor sector. Top-down political alignment for policing
      and funding; contributed to the consultation leading to the Chips Act 2.0
      proposal.
    initiatives: [chips-act-2]

  - id: ai-office
    name: "European AI Office"
    kind: ec-body
    description: >
      Formal regulatory body established internally in January 2024 (formal
      publication February 2024, publicly launched May 2024) via the AI
      Innovation Package to implement and enforce the AI Act coherently across
      member states, e.g. via the AI Act Service Desk.
    initiatives: [ai-act, ai-innovation-package]

  - id: ai-pact
    name: "AI Pact"
    kind: voluntary
    description: >
      Voluntary initiative to support the implementation of the AI Act.
    initiatives: [ai-act]

