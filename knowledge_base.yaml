  # ---------------------------- CYBERSECURITY AND DIGITAL IDENTITY ----------------------------
  - id: cybersecurity-strategy-digital-decade
    name: "EU's Cybersecurity Strategy for the Digital Decade"
    acronym: "Cybersecurity Strategy"
    type: Communication
    status: adopted
    domain: cybersecurity-identity
    framework: [shaping-europes-digital-future]
    dates:
      published: 2020-12
    description: >
      The third cybersecurity strategy in a series (after 2013 and 2017). Lays
      down EC intentions on regulatory, investment, and policy initiatives for
      cybersecurity of essential services and the capability to withstand,
      respond to, and recover from cyberattacks. Addresses resilience and
      technological sovereignty, operational capacity, and international
      cooperation. Key component of "Shaping Europe's Digital Future" and sets
      the vision for many subsequent initiatives.
    builds_on: []
    relates_to: [nis2, cyber-resilience-act, cyber-solidarity-act]
    organizations: [ecso, eccc]
    references: ["[84]"]

  - id: nis2
    name: "Network and Information Systems Directive (NIS2)"
    acronym: "NIS2"
    type: Directive
    status: adopted
    domain: cybersecurity-identity
    framework: [shaping-europes-digital-future]
    dates:
      published: 2022-12
      entered_into_force: 2023-01
      entered_into_application: 2024-10
    description: >
      Replaces the 2016 NIS 1 directive. Targets organizations in 18 sectors
      (energy, transport, healthcare, finance); affected organizations adopt a
      risk-based cybersecurity approach, implement minimum security practices,
      and fulfil reporting requirements. Organizations responsible for their
      own supply chain; top management accountable. Fosters cooperation via
      CSIRTs/CERTs, EU-CyCLONe and the NIS Cooperation Group. Related to the CER
      and DORA.
    builds_on: [cybersecurity-strategy-digital-decade]
    relates_to: [cer-directive, dora, nis2-amendments, cyber-resilience-act]
    organizations: [enisa]
    references: ["[86]", "[87]", "[88]", "[89]", "[90]"]

  - id: cer-directive
    name: "Critical Entities Resilience Directive"
    acronym: "CER"
    type: Directive
    status: adopted
    domain: cybersecurity-identity
    framework: [shaping-europes-digital-future]
    dates:
      published: 2022-12
      entered_into_force: 2023-01
      entered_into_application: 2024-10
    description: >
      Replaces the European Critical Infrastructure Directive of 2008. Requires
      member states to adopt national strategies for the resilience of critical
      entities in specific sectors. These critical entities are automatically
      also subject to the NIS2.
    builds_on: []
    relates_to: [nis2]
    organizations: []
    references: ["[91]"]

  - id: cyber-resilience-act
    name: "Cyber Resilience Act"
    acronym: "CRA"
    type: Regulation
    status: adopted
    domain: cybersecurity-identity
    framework: [shaping-europes-digital-future]
    dates:
      published: 2024-11
      entered_into_force: 2024-12
      entered_into_application: null
    description: >
      Complements the NIS2 by introducing cybersecurity requirements on digital
      products (and components) sold in the EU and connected to the Internet
      (IoT cameras, wearables, apps, software, network appliances). Requirements
      concern the full lifecycle; manufacturers must report incidents and
      release security updates. FOSS may or may not be subject depending on
      responsibility and commercial activity. Entering into application in
      phases: Articles 35-51 on June 2026, Article 14 on September 2026, whole
      regulation on December 2027.
    builds_on: [nis2]
    relates_to: [eucc]
    organizations: []
    references: ["[92]", "[93]", "[94]", "[95]"]

