    domain: cybersecurity-identity
    framework: [competitiveness-compass]
    dates:
      proposed: 2026-01
    description: >
      Set of amendments to the NIS2 (part of the New Cybersecurity Package) to
      increase legal clarity, simplify compliance and reduce costs, facilitate
      data collection on ransomware attacks, and reinforce ENISA's coordinating
      role for cross-border supervision.
    builds_on: [nis2, new-cybersecurity-package]
    amends: [nis2]
    relates_to: []
    organizations: [enisa]
    references: ["[112]", "[120]"]

  - id: action-plan-cybersecurity-ai
    name: "Action Plan on Cybersecurity and Artificial Intelligence"
    acronym: "Action Plan Cyber-AI"
    type: Bundles
    status: adopted
    domain: cybersecurity-identity
    framework: [competitiveness-compass]
    dates:
      published: 2026-07
    description: >
      Strategy to address the use of AI in cybersecurity in terms of both
      benefits (detect vulnerabilities, prevent attacks) and risks (automate
      attacks, identify weaknesses). Three objectives: (i) safe and responsible
      use of AI, (ii) strengthen cybersecurity and resilience, (iii) improve the
      EU's usage of AI for cybersecurity. Complements NIS2, CRA, AI Act, DORA,
      and the Cyber Solidarity Act.
    builds_on: [nis2, cyber-resilience-act, ai-act, dora, cyber-solidarity-act]
    relates_to: []
    organizations: []
