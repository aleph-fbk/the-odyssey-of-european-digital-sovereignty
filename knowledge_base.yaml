# knowledge_base.yaml
# Structured representation of noteworthy European Commission
# initiatives in the digital domain since 2020.
#
# ---------------------------------------------------------------------------
# SCHEMA (informal)
# ---------------------------------------------------------------------------
# meta:
#   title, source, extracted, notes
#
# frameworks:            # top-level strategic references (Communications etc.)
#   - id:                # unique slug
#     name:              # full official name
#     short:             # common short name
#     type:              # regulation | decision | directive | communication |
#                        # recommendation | bundles (comprising packages, omnibuses,
#                        # and action plans)
#     published:         # date as YYYY-MM-DD or YYYY-MM or YYYY
#     description:
#
# domains:               # thematic grouping used for colouring/navigation
#   - id:
#     name:
#
# orgs:                  # noteworthy organizations (non-EC or EC bodies)
#   - id:
#     name:
#     acronym:
#     kind:              # ec-body | association | industry-alliance | company | ...
#     description:
#     initiatives:       # [initiative ids they relate to]
#
# initiatives:           # the core entries
#   - id:
#     name:              # official name
#     acronym:           # e.g. DGA, NIS2
#     type:              # regulation | decision | directive | communication |
#                        # recommendation | bundles
#     status:            # adopted | proposed | draft | scheduled | annual | planned
#     domain:            # id from `domains`
#     framework:         # [ids from `frameworks` this belongs/builds on]
#     dates:             # early/mid/late phases; partial dates may be omitted
#       proposed:
#       published:
#       entered_into_force:
#       entered_into_application:
#     description:       # concise summary
#     builds_on:         # [initiative ids only] stronger dependencies (drives graph);
#                        #   framework membership is expressed via `framework`, and
#                        #   organization links via `organizations`
#     relates_to:        # [initiative ids only] weaker relations
#     amends:            # [initiative ids] instruments this initiative amends
#     replaces:          # [initiative ids] instruments this initiative replaces
#     organizations:     # [org ids]
#     references:        # list of [n] citation keys from the document
# ---------------------------------------------------------------------------

meta:
  title: "European Digital Sovereignty — Noteworthy EC Initiatives Since 2020"
  source: "atlas.txt"
  extracted: "2026-09-04"
  notes: >
    Extraction is based on the current version of atlas.txt (Noteworthy
    Initiatives Since 2020). Dates are transcribed as they appear in the
    document; partial dates are normalised to YYYY-MM or YYYY. `status`
    reflects the stage of each instrument at the time of writing.
    NOTE on citations: atlas.txt uses a sequential endnote numbering scheme
    [1]-[162]. The reference keys below follow this numbering; where an
    endnote entry cites a separate reference (e.g., [6], [14], [15]) the
    corresponding URL is kept under that key.

# ---------------------------------------------------------------------------
# INSTRUMENT TYPES (official EU terminology)
# ---------------------------------------------------------------------------
type_definitions:
  Regulation: >
    Binding and directly applicable in all member states without the need for national
    implementation (transposition); the same rules apply across the EU. The term "act" is
    sometimes used instead of "regulation" (e.g., the AI Act is a regulation).
  Decision: >
    Binding and directly applicable, but targeted at specific addressees (e.g., an EU
    country or an organization).
  Directive: >
    Binding as to the result to be achieved by member states; each member state decides how
    to achieve that result by transposing the directive into national law (usually within two
    years). E.g., the NIS2 is a directive.
  Communication: >
    Non-binding document setting out political priorities and a roadmap of regulatory,
    investment, and policy initiatives. Includes strategies, white papers and other policy
    statements, and is also referred to as a Joint Communication when foreign or security
    policy is involved (e.g., a Joint Declaration agreed by several member states).
  Recommendation: >
    Non-binding initiative suggesting a line of action.
  Bundles: >
    A grouped set of related EU initiatives on a specific subject, published together for
    coherence. Comprises three kinds: Packages (a bundle of related initiatives/legislation on
    a subject), Omnibuses (a bundle consisting only of amendments to existing EU laws), and
    Action Plans (concrete, operational initiatives focusing on a specific aspect of a subject).

