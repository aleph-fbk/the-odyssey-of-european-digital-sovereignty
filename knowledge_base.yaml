    acronym: "revised CSA"
    type: Regulation
    status: proposed
    domain: cybersecurity-identity
    framework: [competitiveness-compass]
    dates:
      proposed: 2026-01
    description: >
      Revision of the Cybersecurity Act aimed at reducing risks in the EU ICT
      supply chain due to foreign suppliers of cybersecurity concern, via a
      risk-based supply chain security framework. Updates the ECCF to increase
      adoption by simplifying certification. Impacts the EUCS and the EUCC.
    builds_on: [cybersecurity-act, new-cybersecurity-package]
    amends: [cybersecurity-act]
    relates_to: [eucs, eucc]
    organizations: [enisa]
    references: ["[106]"]

