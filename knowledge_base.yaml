    dates:
      published: 2022-10
      entered_into_force: 2022-11
      entered_into_application: 2023-05
    description: >
      Building on the DSA, aims to make the digital market fairer by defining
      criteria to identify and regulate the powers of gatekeepers (large digital
      platforms providing online search engines, app stores, messenger
      services).
    builds_on: [digital-services-act]
    relates_to: []
    organizations: []
