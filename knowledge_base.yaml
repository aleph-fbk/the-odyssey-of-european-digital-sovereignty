    framework: [shaping-europes-digital-future]
    dates:
      published: 2022-10
      entered_into_force: 2022-11
      entered_into_application: 2024-02
    description: >
      Building on the GDPR, implements the "fair and competitive market" pillar
      of "Shaping Europe's Digital Future". Strengthens protection of citizens'
      and consumers' fundamental rights online by introducing rules for online
      services (marketplaces, social media, app stores, travel/accommodation
      platforms) on content moderation, illegal content, and advertisements —
      imposing greater accountability on big platforms.
    builds_on: []
    relates_to: [digital-markets-act]
    organizations: []
    references: ["[28]", "[29]"]

