    acronym: "ECCF"
    type: Communication
    status: adopted
    domain: cybersecurity-identity
    framework: []
    dates:
      published: 2019-06
    description: >
      Certification framework established by the original Cybersecurity Act for
      certifying digital products, services, and processes. Certifications under
      the ECCF are voluntary by design; the revision simplifies the process to
      increase adoption.
    builds_on: [cybersecurity-act]
    relates_to: [eucs, eucc, revised-cybersecurity-act, cloud-sovereignty-framework]
    organizations: [enisa]
