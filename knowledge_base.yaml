    framework: [shaping-europes-digital-future]
    dates:
      published: 2022-12
      entered_into_force: 2023-01
      entered_into_application: 2025-01
    description: >
      Concerns digital operational resilience of EU financial entities (banks,
      payment/e-money institutions, insurance companies). Considers critical
      third-party providers (CTPPs) delivering critical digital services to
      financial entities. European supervisory authorities (EBA, EIOPA, ESMA)
      monitor CTPPs. Published first as a draft in September 2020 as part of the
      Digital Finance Package. References the NIS2.
    builds_on: [nis2]
    relates_to: [nis2]
    organizations: []
    references: ["[96]", "[97]", "[98]"]

  - id: eudi-regulation
    name: "European Digital Identity Regulation (eIDAS 2.0)"
    acronym: "EUDI / eIDAS 2.0"
    type: Regulation
    status: adopted
    domain: cybersecurity-identity
    framework: [digital-compass]
    dates:
      published: 2024-04
      entered_into_force: 2024-05
      entered_into_application: "2024-05 (up to end of 2026)"
    description: >
      Traces back to the digital public services areas of the Digital Compass.
      Also known as electronic IDentification, Authentication and trust Services
      (eIDAS 2.0); amends the 2014 eIDAS Regulation with an expanded list of
      "qualified trust services" and stronger governance, supervision, and
      liability rules. A fundamental component is the European Digital Identity
      Wallet (EUDI Wallet): by end of 2026, member states must provide a
      free-to-use wallet app. Mandates selective disclosure, unlinkability, and
      interoperability via the Architecture Reference Framework (ARF). Subject
      of large-scale pilot projects.
    builds_on: []
    relates_to: [european-business-wallets]
    organizations: []
    references: ["[100]", "[101]", "[102]"]

